// AGP 8.11.0 / Kotlin 2.0.21 — confirmed working combination on Gradle 9.1.0.
// Do not bump either without also updating the other + testing a full clean
// build in isolation first.
plugins {
    id 'com.android.application' version '8.11.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
